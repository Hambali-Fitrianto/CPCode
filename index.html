<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Share Code</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Animate CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4 text-primary animate__animated animate__fadeInDown">💻 Share Code</h2>

    <!-- Form Input -->
    <div class="card mb-4 animate__animated animate__fadeInUp">
        <div class="card-header bg-primary text-white">Tambah Kode</div>
        <div class="card-body">
            <div class="mb-3">
                <label for="codeName" class="form-label">Nama Kode</label>
                <input type="text" id="codeName" class="form-control" placeholder="Contoh: Alert Script">
            </div>
            <div class="mb-3">
                <label for="codeContent" class="form-label">Kode</label>
                <textarea id="codeContent" class="form-control" rows="6" placeholder="Masukkan kode di sini"></textarea>
            </div>
            <button class="btn btn-primary w-100 btn-custom" id="saveCode">💾 Simpan Kode</button>
        </div>
    </div>

    <!-- Daftar Kode -->
    <h4 class="text-secondary animate__animated animate__fadeInLeft">📜 Daftar Kode:</h4>
    <ul class="list-group mb-3" id="codeList"></ul>

    <!-- Tempat Menampilkan Kode -->
    <div id="codeDisplay"></div>
</div>

<!-- Footer -->
<footer class="footer text-center py-3 animate__animated animate__fadeInUp">
    © 2025 <strong>Ibal Bojay</strong>. All Rights Reserved.
</footer>

<!-- jQuery & Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
$(document).ready(function () {
    $('#saveCode').on('click', function () {
        const name = $('#codeName').val().trim();
        const code = $('#codeContent').val().trim();

        if (name === '' || code === '') {
            Swal.fire('Oops!', 'Nama kode dan isi kode tidak boleh kosong.', 'warning');
            return;
        }

        // Elemen list dengan tombol download
        const listItem = $('<li class="list-group-item d-flex justify-content-between align-items-center">');

        // Teks nama kode yang bisa diklik untuk preview
        const codeTitle = $('<span>').text(name).css('cursor', 'pointer').click(function () {
            $('#codeDisplay').html(
                `<pre class="mt-3 p-3 bg-light border rounded"><code>${$('<div>').text(code).html()}</code></pre>`
            );
        });

        // Tombol download
        const downloadBtn = $('<button class="btn btn-sm btn-outline-secondary">⬇️ Download</button>');
        downloadBtn.click(function () {
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = name.replace(/\s+/g, '_') + '.txt';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

        listItem.append(codeTitle).append(downloadBtn);
        $('#codeList').append(listItem);

        // Bersihkan input
        $('#codeName').val('');
        $('#codeContent').val('');

        Swal.fire('Sukses!', 'Kode berhasil ditambahkan dan bisa diunduh.', 'success');
    });
});
</script>

</body>
</html>
