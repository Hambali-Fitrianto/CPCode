<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Share Code</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Animate CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- Custom Style -->
    <style>
        body {
            background-color: #f0f2f5;
        }

        .code-image-preview {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Fira Code', monospace;
            white-space: pre-wrap;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            overflow-x: auto;
            font-size: 14px;
            border: 1px solid #444;
        }

        .token-keyword { color: #569CD6; }
        .token-string { color: #CE9178; }
        .token-function { color: #DCDCAA; }
        .token-comment { color: #6A9955; font-style: italic; }

        .footer {
            background: #f8f9fa;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4 text-primary animate__animated animate__fadeInDown">💻 Share Code</h2>

    <!-- Form Input -->
    <div class="card mb-4 animate__animated animate__fadeInUp">
        <div class="card-header bg-primary text-white">Tambah Kode</div>
        <div class="card-body">
            <div class="mb-3">
                <label for="codeName" class="form-label">Nama Kode</label>
                <input type="text" id="codeName" class="form-control" placeholder="Contoh: Alert Script">
            </div>
            <div class="mb-3">
                <label for="codeContent" class="form-label">Kode</label>
                <textarea id="codeContent" class="form-control" rows="6" placeholder="Masukkan kode di sini"></textarea>
            </div>
            <button class="btn btn-primary w-100 btn-custom" id="saveCode">💾 Simpan Kode</button>
        </div>
    </div>

    <!-- Daftar Kode -->
    <h4 class="text-secondary animate__animated animate__fadeInLeft">📜 Daftar Kode:</h4>
    <ul class="list-group mb-3" id="codeList"></ul>

    <!-- Tempat Menampilkan Kode -->
    <div id="codeDisplayContainer" class="mb-4">
        <div id="codeDisplay" class="code-image-preview d-none"></div>
        <button class="btn btn-success mt-2 d-none" id="downloadAsImage">⬇️ Download sebagai Gambar</button>
    </div>
</div>

<!-- Footer -->
<footer class="footer text-center py-3 animate__animated animate__fadeInUp">
    © 2025 <strong>Ibal Bojay</strong>. All Rights Reserved.
</footer>

<!-- jQuery & Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- SweetAlert JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
$(document).ready(function () {
    let currentCodeName = '';

    function syntaxHighlight(code) {
        return code
            .replace(/(\/\/[^\n]*)/g, '<span class="token-comment">$1</span>')
            .replace(/("(?:\\.|[^"\\])*")/g, '<span class="token-string">$1</span>')
            .replace(/\b(const|let|var|function|return|if|else|for|while|class|new|import|from)\b/g, '<span class="token-keyword">$1</span>')
            .replace(/\b(console|alert|log|prompt|document|window)\b/g, '<span class="token-function">$1</span>');
    }

    $('#saveCode').on('click', function () {
        const name = $('#codeName').val().trim();
        const code = $('#codeContent').val().trim();

        if (name === '' || code === '') {
            Swal.fire('Oops!', 'Nama kode dan isi kode tidak boleh kosong.', 'warning');
            return;
        }

        const listItem = $('<li class="list-group-item d-flex justify-content-between align-items-center">');

        const codeTitle = $('<span>').text(name).css('cursor', 'pointer').click(function () {
            const highlighted = syntaxHighlight($('<div>').text(code).html());
            $('#codeDisplay').html(highlighted).removeClass('d-none');
            $('#downloadAsImage').removeClass('d-none');
            currentCodeName = name;
        });

        listItem.append(codeTitle);
        $('#codeList').append(listItem);

        $('#codeName').val('');
        $('#codeContent').val('');

        Swal.fire('Sukses!', 'Kode berhasil ditambahkan.', 'success');
    });

    $('#downloadAsImage').on('click', function () {
        html2canvas(document.getElementById("codeDisplay")).then(function(canvas) {
            const link = document.createElement('a');
            link.href = canvas.toDataURL("image/png");
            link.download = currentCodeName.replace(/\s+/g, '_') + '.png';
            link.click();
        });
    });
});
</script>

</body>
</html>
